# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - uv sync

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
